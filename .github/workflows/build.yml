name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Play publish script and listing limits
        run: python3 scripts/play_publish_test.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore (Android only -- iOS requires macOS runner)
        run: |
          dotnet restore src/OpenKSeF.Mobile/OpenKSeF.Mobile.csproj -p:TargetFrameworks=net10.0-android
          dotnet restore src/OpenKSeF.Mobile.Tests/OpenKSeF.Mobile.Tests.csproj
          dotnet restore src/OpenKSeF.Mobile.E2E.Shared/OpenKSeF.Mobile.E2E.Shared.csproj
          dotnet restore src/OpenKSeF.Mobile.E2E.Android/OpenKSeF.Mobile.E2E.Android.csproj

      - name: Build MAUI Android
        run: dotnet build src/OpenKSeF.Mobile/OpenKSeF.Mobile.csproj --no-restore -f net10.0-android -c Release -p:AndroidKeyStore=false

      - name: Build MAUI Android with Firebase (fake google-services.json)
        shell: bash
        run: |
          json=src/OpenKSeF.Mobile/Platforms/Android/google-services.json
          echo '{"project_info":{"project_number":"000000000000","project_id":"ci-fake","storage_bucket":"ci-fake.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.openksef.mobile"}},"oauth_client":[],"api_key":[{"current_key":"ci-fake-key"}],"services":{}}],"configuration_version":"1"}' > "$json"
          dotnet build src/OpenKSeF.Mobile/OpenKSeF.Mobile.csproj -f net10.0-android -c Release -p:AndroidKeyStore=false -p:TargetFrameworks=net10.0-android -o "$RUNNER_TEMP/firebase-build"
          rm "$json"

      - name: Build tests
        run: |
          dotnet build src/OpenKSeF.Mobile.Tests/OpenKSeF.Mobile.Tests.csproj --no-restore -c Release
          dotnet build src/OpenKSeF.Mobile.E2E.Android/OpenKSeF.Mobile.E2E.Android.csproj --no-restore -c Release

      - name: Unit tests
        run: dotnet test src/OpenKSeF.Mobile.Tests/OpenKSeF.Mobile.Tests.csproj --no-build -c Release --logger "trx;LogFileName=unit-test-results.trx" --nologo

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/TestResults/*.trx'
