name: iOS Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/OpenKSeF.Mobile/**'
      - '!src/OpenKSeF.Mobile/Platforms/Android/**'
      - 'src/nuget.config'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ios:
    name: iOS Release build (unsigned, no upload)
    runs-on: macos-26
    timeout-minutes: 40
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.3xx'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # Workload set 10.0.303.1 ships .NET for iOS 26.5, the newest that runs on Xcode 26.x.
      - name: Pin .NET SDK
        run: dotnet new globaljson --sdk-version 10.0.303 --roll-forward latestPatch --force && dotnet --version

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.303.1

      - name: Build iOS Release
        run: |
          dotnet build src/OpenKSeF.Mobile/OpenKSeF.Mobile.csproj \
            -f net10.0-ios \
            -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false
