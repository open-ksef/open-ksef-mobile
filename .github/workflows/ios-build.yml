name: iOS Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/OpenKSeF.Mobile/**/*.csproj'
      - 'src/OpenKSeF.Mobile/Platforms/iOS/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ios:
    name: iOS Release build (unsigned, no upload)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build iOS Release
        run: |
          dotnet build src/OpenKSeF.Mobile/OpenKSeF.Mobile.csproj \
            -f net10.0-ios \
            -c Release \
            -p:TargetFrameworks=net10.0-ios
