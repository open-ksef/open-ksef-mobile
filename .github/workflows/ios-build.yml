name: iOS Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/OpenKSeF.Mobile/**'
      - '!src/OpenKSeF.Mobile/Platforms/Android/**'
      - 'src/nuget.config'
      - '.github/workflows/ios-build.yml'
      - '.github/actions/setup-ios-toolchain/**'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ios:
    name: iOS Release build (unsigned, no upload)
    runs-on: macos-26
    timeout-minutes: 40
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ios-toolchain

      - name: Build iOS Release
        run: |
          dotnet build src/OpenKSeF.Mobile/OpenKSeF.Mobile.csproj \
            -f net10.0-ios \
            -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false
